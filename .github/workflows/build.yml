name: Compilar minibunker

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Android SDK (API 35)
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      # Se usa Gradle 8.14.3 directamente (la misma versión que el wrapper) para no
      # depender del permiso de ejecución de gradlew ni de la validación de su .jar.
      - name: Preparar Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Compilar el APK de depuración
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Ejecutar las pruebas unitarias
        run: gradle testDebugUnitTest --no-daemon

      - name: Publicar el APK
        uses: actions/upload-artifact@v4
        with:
          name: minibunker-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publicar informes de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informes-pruebas
          path: app/build/reports/tests/
          if-no-files-found: ignore
